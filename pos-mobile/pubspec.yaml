name: pos_mobile
description: Kasir Digital - Mobile POS Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  shared_preferences: ^2.3.2

  # UI & Fonts
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.69.0

  # Utils
  intl: ^0.19.0
  provider: ^6.1.2
  blue_thermal_printer: ^1.2.3
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  qr_flutter: ^4.1.0
  cloud_functions: ^6.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
